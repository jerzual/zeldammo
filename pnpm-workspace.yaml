allowBuilds:
  '@parcel/watcher': false
  esbuild: true
  msgpackr-extract: true
# pnpm v11 moved settings out of the package.json "pnpm" field into this file.
# Keep the optional native uWebSockets transport out of the install entirely.
ignoredOptionalDependencies:
  - '@colyseus/uwebsockets-transport'
  - 'sass'
minimumReleaseAgeExclude:
  - esbuild@0.24.3
  - esbuild@0.28.1
overrides:
  esbuild@<=0.24.2: ^0.24.3
  esbuild@>=0.17.0 <0.28.1: ^0.28.1
