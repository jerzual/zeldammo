---
# This workflow will do a clean install of node dependencies,
# build the source code and run tests on each commit, in pull
# requests and main branches

name: Node.js CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  NODE_VERSION: 26
jobs:
  build:
    runs-on: ubuntu-slim
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup pnpm and node.js
        uses: pnpm/setup@v3.1.1
        with:
          runtime: node@${{ env.NODE_VERSION }}
          cache: true
          require-lockfile: true
      - run: pnpm run build
      - run: pnpm test
